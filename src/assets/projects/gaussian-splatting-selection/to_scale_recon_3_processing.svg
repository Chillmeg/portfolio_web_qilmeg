<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, sans-serif">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&amp;display=swap');
    text { font-family: 'Poppins', sans-serif; fill: #000; }
    .title { font-size: 24px; font-weight: 600; }
    .subtitle { font-size: 14px; font-weight: 300; fill: #555; font-style: italic; }
    .section-label { font-size: 11px; font-weight: 500; fill: #666; letter-spacing: 1.5px; }
    .section-title { font-size: 16px; font-weight: 600; }
    .type-title { font-size: 14px; font-weight: 500; text-anchor: middle; }
    .body { font-size: 11px; font-weight: 300; fill: #333; }
    .body-mid { font-size: 12px; font-weight: 400; fill: #222; }
    .tool-tag { font-size: 10px; font-weight: 500; fill: #fff; }
    .stage-note { font-size: 11px; font-weight: 400; fill: #555; font-style: italic; text-anchor: middle; }
    .box { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .sub-box { fill: #fff; stroke: #000; stroke-width: 0.8; }
    .tool-pill { fill: #000; stroke: #000; }
    .arrow { stroke: #000; stroke-width: 1; fill: none; }
    .arrow-dashed { stroke: #000; stroke-width: 1; fill: none; stroke-dasharray: 3 3; opacity: 0.6; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="44" class="title">Data processing — three image types + masking</text>
  <text x="40" y="66" class="subtitle">Each type serves a different role in the pipeline; pinhole images are derived later, after camera alignment.</text>

  <!-- Source marker -->
  <rect x="420" y="100" width="160" height="40" class="box" rx="4"/>
  <text x="500" y="125" class="body-mid" text-anchor="middle" font-weight="500">Raw .insv (360 video)</text>

  <!-- Vertical arrow down -->
  <line x1="500" y1="140" x2="500" y2="165" class="arrow" marker-end="url(#arrow)"/>

  <!-- Three types row -->
  <!-- Fisheye -->
  <rect x="40" y="170" width="295" height="180" class="box" rx="6"/>
  <text x="187" y="200" class="type-title">Fisheye image</text>
  <rect x="220" y="210" width="100" height="22" class="tool-pill" rx="11"/>
  <text x="270" y="225" class="tool-tag" text-anchor="middle">FFMPEG (CLI)</text>
  <text x="60" y="255" class="body">Directly extracted from .insv</text>
  <text x="60" y="271" class="body">using ffmpeg. Preserves native</text>
  <text x="60" y="287" class="body">lens projection, no re-sampling.</text>
  <text x="60" y="320" class="body" font-style="italic">Used when training pipeline</text>
  <text x="60" y="336" class="body" font-style="italic">supports fisheye directly (LichtFeld).</text>

  <!-- Equirectangular -->
  <rect x="352" y="170" width="295" height="180" class="box" rx="6"/>
  <text x="499" y="200" class="type-title">Equirectangular image</text>
  <rect x="362" y="210" width="155" height="22" class="tool-pill" rx="11"/>
  <text x="439" y="225" class="tool-tag" text-anchor="middle">Insta360 Studio → FFMPEG</text>
  <text x="372" y="255" class="body">Better seam stitching than direct</text>
  <text x="372" y="271" class="body">FFMPEG output. Export equirect-</text>
  <text x="372" y="287" class="body">angular video first, then extract</text>
  <text x="372" y="303" class="body">frames with ffmpeg.</text>
  <text x="372" y="336" class="body" font-style="italic">Standard 360° format, works across tools.</text>

  <!-- Pinhole (derived) -->
  <rect x="664" y="170" width="295" height="180" class="box" rx="6" stroke-dasharray="4 3"/>
  <text x="811" y="200" class="type-title">Pinhole image</text>
  <rect x="730" y="210" width="165" height="22" class="tool-pill" rx="11"/>
  <text x="812" y="225" class="tool-tag" text-anchor="middle">Metashape (post-alignment)</text>
  <text x="684" y="255" class="body">Derived <tspan font-weight="500">after</tspan> camera alignment.</text>
  <text x="684" y="271" class="body">Metashape can re-project views</text>
  <text x="684" y="287" class="body">as pinhole and simultaneously</text>
  <text x="684" y="303" class="body">re-project masks to match.</text>
  <text x="684" y="336" class="body" font-style="italic">See Stage 3 for how this is triggered.</text>

  <!-- Arrow down to masking -->
  <line x1="500" y1="360" x2="500" y2="395" class="arrow" marker-end="url(#arrow)"/>

  <!-- Masking block -->
  <rect x="40" y="400" width="920" height="125" class="box" rx="6"/>
  <text x="60" y="425" class="section-label">MASKING — CROSS-CUTTING</text>
  <rect x="60" y="440" width="80" height="24" class="tool-pill" rx="12"/>
  <text x="100" y="457" class="tool-tag" text-anchor="middle">SAM 2</text>
  <text x="155" y="457" class="body-mid" font-weight="500">Segment Anything Model 2</text>
  <text x="60" y="485" class="body">Generates per-frame masks to isolate the static scene from transient elements (people, reflections, moving objects).</text>
  <text x="60" y="501" class="body">Masks are applied to fisheye or equirectangular images and travel with them through alignment and training.</text>
  <text x="60" y="517" class="body">For pinhole workflow, Metashape re-projects both image and mask into pinhole space together.</text>
</svg>
