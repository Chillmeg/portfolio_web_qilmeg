<svg width="1000" height="580" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, sans-serif">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&amp;display=swap');
    text { font-family: 'Poppins', sans-serif; fill: #000; }
    .title { font-size: 24px; font-weight: 600; }
    .subtitle { font-size: 14px; font-weight: 300; fill: #555; font-style: italic; }
    .section-label { font-size: 11px; font-weight: 500; fill: #666; letter-spacing: 1.5px; }
    .section-title { font-size: 16px; font-weight: 600; }
    .q-label { font-size: 13px; font-weight: 500; }
    .body { font-size: 12px; font-weight: 300; fill: #333; }
    .body-strong { font-size: 12px; font-weight: 500; }
    .cell-header { font-size: 11px; font-weight: 500; fill: #555; }
    .cell-value { font-size: 12px; font-weight: 400; }
    .box { fill: #fff; stroke: #000; stroke-width: 1; }
    .q-box { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .table-line { stroke: #000; stroke-width: 0.5; opacity: 0.3; }
    .arrow { stroke: #000; stroke-width: 1; fill: none; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="44" class="title">Raw input — 360 videos from Insta360 X4</text>
  <text x="40" y="66" class="subtitle">Why this capture format. Two design decisions: 360° vs. forward-facing, and video vs. stills.</text>

  <!-- Question 1: Why 360 -->
  <rect x="40" y="100" width="920" height="120" class="q-box" rx="6"/>
  <text x="60" y="125" class="section-label">DECISION 1</text>
  <text x="60" y="150" class="section-title">Why 360° capture</text>
  <text x="60" y="178" class="body-strong">Interior scans are fundamentally different from object scans.</text>
  <text x="60" y="200" class="body">Camera rays look <tspan font-weight="500">outwards</tspan> from the viewer's position into the surrounding space — not inwards toward a</text>
  <text x="60" y="215" class="body">centered subject. 360° capture covers the full sphere from a single station, matching this geometry.</text>

  <!-- Question 2: Why video -->
  <rect x="40" y="240" width="920" height="305" class="q-box" rx="6"/>
  <text x="60" y="265" class="section-label">DECISION 2</text>
  <text x="60" y="290" class="section-title">Why video (not stills)</text>
  <text x="60" y="318" class="body-strong">Empirical test: 72 MP stills vs. 8K video on the same space.</text>
  <text x="60" y="340" class="body">Reconstruction quality is comparable. Video trades slightly longer training time for much denser input,</text>
  <text x="60" y="355" class="body">with full control over frame-extraction rate.</text>

  <!-- Comparison table -->
  <rect x="60" y="375" width="880" height="140" fill="none" stroke="#000" stroke-width="0.8" rx="4"/>

  <!-- Headers -->
  <text x="220" y="398" class="cell-header" text-anchor="middle">72 MP stills</text>
  <text x="500" y="398" class="cell-header" text-anchor="middle">8K video</text>
  <text x="780" y="398" class="cell-header" text-anchor="middle">Ratio</text>
  <line x1="80" y1="408" x2="920" y2="408" class="table-line"/>

  <!-- Row 1: input count -->
  <text x="80" y="428" class="cell-header">Input count</text>
  <text x="220" y="428" class="cell-value" text-anchor="middle">198 images</text>
  <text x="500" y="428" class="cell-value" text-anchor="middle">598 frames extracted</text>
  <text x="780" y="428" class="cell-value" text-anchor="middle">≈ 3.0×</text>
  <line x1="80" y1="438" x2="920" y2="438" class="table-line"/>

  <!-- Row 2: training time -->
  <text x="80" y="458" class="cell-header">Training time</text>
  <text x="220" y="458" class="cell-value" text-anchor="middle">6h 34m</text>
  <text x="500" y="458" class="cell-value" text-anchor="middle">15h 28m</text>
  <text x="780" y="458" class="cell-value" text-anchor="middle">≈ 2.38×</text>
  <line x1="80" y1="468" x2="920" y2="468" class="table-line"/>

  <!-- Row 3: quality -->
  <text x="80" y="488" class="cell-header">Reconstruction quality</text>
  <text x="500" y="488" class="cell-value" text-anchor="middle">comparable (see attached sample)</text>
  <line x1="80" y1="498" x2="920" y2="498" class="table-line"/>

  <!-- Row 4: flexibility -->
  <text x="80" y="508" class="cell-header">Frame control</text>
  <text x="500" y="508" class="cell-value" text-anchor="middle">video allows variable extraction rate</text>
</svg>
